<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" role="img" aria-label="LEGO Batwoman">
  <defs>
    <linearGradient id="capeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <filter id="toyShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cape -->
  <path
    d="M48 78 C28 92 18 130 22 168 C40 158 52 150 58 142 L58 90 Z"
    fill="url(#capeGrad)"
    opacity="0.95"
  />
  <path
    d="M112 78 C132 92 142 130 138 168 C120 158 108 150 102 142 L102 90 Z"
    fill="url(#capeGrad)"
    opacity="0.95"
  />

  <!-- Legs -->
  <rect x="58" y="148" width="20" height="42" rx="3" fill="#1c1c20" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="82" y="148" width="20" height="42" rx="3" fill="#1c1c20" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Feet -->
  <rect x="54" y="186" width="26" height="10" rx="3" fill="#0d0d10"/>
  <rect x="80" y="186" width="26" height="10" rx="3" fill="#0d0d10"/>

  <!-- Hip / belt area -->
  <rect x="54" y="138" width="52" height="14" rx="3" fill="#1a1a1e" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="54" y="140" width="52" height="6" rx="2" fill="#f5c518"/>
  <rect x="74" y="139" width="12" height="8" rx="1.5" fill="#e8b40a" stroke="#a67c00" stroke-width="0.8"/>

  <!-- Torso -->
  <path
    d="M52 78 L108 78 L112 138 L48 138 Z"
    fill="url(#suitGrad)"
    stroke="#0a0a0a"
    stroke-width="1.8"
    filter="url(#toyShadow)"
  />
  <!-- Chest bat emblem (yellow oval) -->
  <ellipse cx="80" cy="104" rx="18" ry="12" fill="#f5c518" stroke="#1a1200" stroke-width="1.2"/>
  <path
    fill="#0a0a0a"
    d="M80 96
       C78 99 76 101 72 103
       C68 100 62 101 60 105
       C64 104 68 106 70 109
       C66 111 60 115 58 120
       C64 116 70 118 74 121
       C76 123 78 125 80 127
       C82 125 84 123 86 121
       C90 118 96 116 102 120
       C100 115 94 111 90 109
       C92 106 96 104 100 105
       C98 101 92 100 88 103
       C84 101 82 99 80 96Z"
  />

  <!-- Arms -->
  <rect x="34" y="82" width="18" height="40" rx="6" fill="#1c1c20" stroke="#0a0a0a" stroke-width="1.5" transform="rotate(-12 43 102)"/>
  <rect x="108" y="82" width="18" height="40" rx="6" fill="#1c1c20" stroke="#0a0a0a" stroke-width="1.5" transform="rotate(12 117 102)"/>
  <!-- Hands (C-clamps) -->
  <path d="M28 118 C24 118 22 122 22 126 C22 132 26 136 32 136 L36 136 L36 130 L32 130 C30 130 28 128 28 126 C28 124 30 122 32 122 L38 122 L38 118 Z" fill="#1c1c20" stroke="#0a0a0a" stroke-width="1"/>
  <path d="M132 118 C136 118 138 122 138 126 C138 132 134 136 128 136 L124 136 L124 130 L128 130 C130 130 132 128 132 126 C132 124 130 122 128 122 L122 122 L122 118 Z" fill="#1c1c20" stroke="#0a0a0a" stroke-width="1"/>

  <!-- Neck stud -->
  <rect x="72" y="70" width="16" height="10" rx="2" fill="#f2c4a0"/>

  <!-- Head (yellow LEGO) under cowl hint -->
  <rect x="58" y="28" width="44" height="44" rx="6" fill="#f2c4a0" stroke="#d4a07a" stroke-width="1"/>

  <!-- Red hair sides -->
  <path d="M56 36 C48 42 46 58 50 68 L58 66 L58 40 Z" fill="#8b1a1a"/>
  <path d="M104 36 C112 42 114 58 110 68 L102 66 L102 40 Z" fill="#8b1a1a"/>

  <!-- Cowl -->
  <path
    d="M56 34
       L56 58
       C56 70 64 76 80 76
       C96 76 104 70 104 58
       L104 34
       L98 18
       L92 34
       L80 28
       L68 34
       L62 18
       Z"
    fill="#141418"
    stroke="#000"
    stroke-width="1.5"
  />
  <!-- Ear tips -->
  <path d="M62 18 L66 34 L58 34 Z" fill="#0a0a0a"/>
  <path d="M98 18 L102 34 L94 34 Z" fill="#0a0a0a"/>

  <!-- White eye slits -->
  <rect x="64" y="46" width="12" height="5" rx="1.5" fill="#f5f5f5"/>
  <rect x="84" y="46" width="12" height="5" rx="1.5" fill="#f5f5f5"/>

  <!-- Smile line -->
  <path d="M72 62 Q80 66 88 62" fill="none" stroke="#c48a6a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
